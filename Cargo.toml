[workspace]
resolver = "2"
# Phase-1 modularization of pi.rs. The legacy single-crate tree was relocated
# to crates/pi/ unchanged; crates/pi-mono is the workspace aggregator;
# xtask hosts workspace plumbing (cargo xtask ci).
members = [
    "crates/pi",
    "crates/pi-agent-cx",
    "crates/pi-bpe",
    "crates/pi-mono",
    "crates/pi-buffer-shim",
    "crates/pi-cli",
    "crates/pi-context-files",
    "crates/pi-crypto-shim",
    "crates/pi-delight",
    "crates/pi-dialects",
    "crates/pi-error",
    "crates/pi-failover",
    "crates/pi-file-lock",
    "crates/pi-flake-classifier",
    "crates/pi-hostcall-superinstructions",
    "crates/pi-hostcall-io-uring-lane",
    "crates/pi-hostcall-s3-fifo",
    "crates/pi-swarm-progress-slo",
    "crates/pi-extension-replay",
    "crates/pi-swarm-activity-ledger",
    "crates/pi-extension-scoring",
    "crates/pi-scheduler",
    "crates/pi-conformance",
    "crates/pi-gallery",
    "crates/pi-http-shim",
    "crates/pi-jsonrpc",
    "crates/pi-markdown-rich",
    "crates/pi-magic-keywords",
    "crates/pi-model",
    "crates/pi-overlay-system",
    "crates/pi-platform",
    "crates/pi-profiler",
    "crates/pi-provider",
    "crates/pi-provider-metadata",
    "crates/pi-session-metrics",
    "crates/pi-sse",
    "crates/pi-stats",
    "crates/pi-status-line",
    "crates/pi-token-count",
    "crates/pi-turn-recovery",
    "crates/pi-undo",
    "crates/pi-web-remote",
    "xtask",
]
# Exclude the workspace_smoke integration test's own target directory.
exclude = []

[workspace.package]
version = "0.4.0"
edition = "2024"
rust-version = "1.95"
authors = ["Jeffrey Emanuel", "Multica Modularization"]
license = "MIT"
repository = "https://github.com/louloulin/pi_agent_rust"
homepage = "https://github.com/louloulin/pi_agent_rust"
documentation = "https://docs.rs/pi"
readme = "README.md"

# Single source of truth for crate dependency versions. Member crates
# reference these via dep = { workspace = true }. New top-level deps must
# land here first, then be claimed by a member.
[workspace.dependencies]
# CLI
clap = { version = "4.5.60", features = ["derive", "env", "string"] }
clap_complete = "4.5.66"

# Stage 2 leaf crates (workspace-internal path deps, single source of truth).
pi-agent-cx = { path = "crates/pi-agent-cx", version = "0.1.0" }
pi-bpe = { path = "crates/pi-bpe", version = "0.1.0" }
pi-buffer-shim = { path = "crates/pi-buffer-shim", version = "0.1.0" }
pi-cli = { path = "crates/pi-cli", version = "0.1.0" }
pi-context-files = { path = "crates/pi-context-files", version = "0.1.0" }
pi-crypto-shim = { path = "crates/pi-crypto-shim", version = "0.1.0" }
pi-delight = { path = "crates/pi-delight", version = "0.1.0" }
pi-dialects = { path = "crates/pi-dialects", version = "0.1.0" }
pi-error = { path = "crates/pi-error", version = "0.1.0" }
pi-failover = { path = "crates/pi-failover", version = "0.1.0" }
pi-file-lock = { path = "crates/pi-file-lock", version = "0.1.0" }
pi-http-shim = { path = "crates/pi-http-shim", version = "0.1.0" }
pi-session-metrics = { path = "crates/pi-session-metrics", version = "0.1.0" }
pi-undo = { path = "crates/pi-undo", version = "0.1.0" }
pi-web-remote = { path = "crates/pi-web-remote", version = "0.1.0" }
pi-flake-classifier = { path = "crates/pi-flake-classifier", version = "0.1.0" }
pi-hostcall-superinstructions = { path = "crates/pi-hostcall-superinstructions", version = "0.1.0" }
pi-hostcall-io-uring-lane = { path = "crates/pi-hostcall-io-uring-lane", version = "0.1.0" }
pi-hostcall-s3-fifo = { path = "crates/pi-hostcall-s3-fifo", version = "0.1.0" }
pi-swarm-progress-slo = { path = "crates/pi-swarm-progress-slo", version = "0.1.0" }
pi-extension-replay = { path = "crates/pi-extension-replay", version = "0.1.0" }
pi-swarm-activity-ledger = { path = "crates/pi-swarm-activity-ledger", version = "0.1.0" }
pi-extension-scoring = { path = "crates/pi-extension-scoring", version = "0.1.0" }
pi-scheduler = { path = "crates/pi-scheduler", version = "0.1.0" }
pi-conformance = { path = "crates/pi-conformance", version = "0.1.0" }
pi-gallery = { path = "crates/pi-gallery", version = "0.1.0" }
pi-jsonrpc = { path = "crates/pi-jsonrpc", version = "0.1.0" }
pi-markdown-rich = { path = "crates/pi-markdown-rich", version = "0.1.0" }
pi-model = { path = "crates/pi-model", version = "0.1.0" }
pi-magic-keywords = { path = "crates/pi-magic-keywords", version = "0.1.0" }
pi-overlay-system = { path = "crates/pi-overlay-system", version = "0.1.0" }
pi-platform = { path = "crates/pi-platform", version = "0.4.0" }
pi-pmu-telemetry = { path = "crates/pi-pmu-telemetry", version = "0.1.0" }
pi-profiler = { path = "crates/pi-profiler", version = "0.1.0" }
pi-provider = { path = "crates/pi-provider", version = "0.1.0" }
pi-provider-metadata = { path = "crates/pi-provider-metadata", version = "0.1.0" }
pi-sse = { path = "crates/pi-sse", version = "0.1.0" }
pi-stats = { path = "crates/pi-stats", version = "0.1.0" }
pi-status-line = { path = "crates/pi-status-line", version = "0.1.0" }
pi-token-count = { path = "crates/pi-token-count", version = "0.1.0" }
pi-turn-recovery = { path = "crates/pi-turn-recovery", version = "0.1.0" }

# Async runtime
asupersync = { version = "0.4.4", default-features = false, features = ["tls-webpki-roots", "tls-native-roots", "test-internals"] }
futures = "0.3"
async-trait = "0.1"

# URL reading
htmd = "0.5.5"
pdf-extract = { version = "0.12" }
url = "2"

# Signals / PTY
ctrlc = "3.5.2"
portable-pty = "0.9"

# Serialization
serde = { version = "1", features = ["derive", "rc"] }
serde_json = { version = "1", features = ["raw_value"] }
json5 = "1.3.1"
toml = "1.0.3"

# Errors
anyhow = "1.0.104"
thiserror = "2"

# Terminal output / TUI
rich_rust = { version = "0.2.2", features = ["markdown"] }
crossterm = { version = "0.29" }
enable-ansi-support = "0.2"
bubbletea = { package = "charmed-bubbletea", version = "0.2.0" }
lipgloss = { package = "charmed-lipgloss", version = "0.2.0" }
bubbles = { package = "charmed-bubbles", version = "0.2.0" }
glamour = { package = "charmed-glamour", version = "0.2.0" }
unicode-width = { version = "0.2" }
textwrap = { version = "0.16" }
arboard = { version = "3.6.1" }
ftui = { version = "0.7", default-features = false, features = ["runtime", "crossterm"] }
ftui-extras = { version = "0.7", default-features = false, features = ["markdown"] }

# Filesystem
dirs = "6"
tempfile = "3.25.0"
fs4 = "1.1"
glob = "0.3"
ignore = "0.4"
globset = "0.4"
grep-regex = "0.1"
grep-searcher = "0.1"
rustix = { version = "1.1.4", features = ["fs", "process"] }
crossbeam-queue = "0.3"
jsonschema = { version = "0.42.0", default-features = false }
fsqlite = { version = "0.3.14", default-features = false, features = ["native", "fts5"] }

# Time
chrono = { version = "0.4", features = ["serde"] }

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Utilities
uuid = { version = "1.21.0", features = ["v4"] }
memchr = "2.8.0"
signal-hook = "0.4.4"
base64 = "0.23"
flate2 = "1.1.9"
sha2 = "0.11"
sha1 = "0.11"
md-5 = "0.11"
hmac = "0.13"
pbkdf2 = { version = "0.13.0", features = ["hmac"] }
scrypt = { version = "0.12.0", default-features = false }
getrandom = "0.4.1"
regex = "1.12.3"
ring = "0.17.14"
semver = "1.0.27"
crc32c = "0.6"
ast-grep-core = "0.40"
fancy-regex = "0.18.0"
rustc-hash = "2.1.3"
bstr = "1.13.1"
ast-grep-language = { version = "0.40", default-features = false, features = [
    "tree-sitter-bash",
    "tree-sitter-python",
    "tree-sitter-javascript",
    "tree-sitter-typescript",
    "tree-sitter-ruby",
    "tree-sitter-rust",
    "tree-sitter-go",
] }
unicode-normalization = "0.1"
xxhash-rust = { version = "0.8", features = ["xxh32"] }
similar = "2"
sysinfo = "0.39.6"
filetime = "0.2.27"

# Plugin runtimes
rquickjs = { version = "0.12.2", features = ["futures", "loader"] }
wasmtime = { version = "47.0.3", features = ["component-model"] }

# Image / PDF / sampling / alloc
image = { version = "0.25", default-features = false, features = [
    "jpeg",
    "png",
    "gif",
    "webp",
    "rayon",
] }
tiktoken-rs = { version = "0.12.0" }
pprof = { version = "0.14", features = ["flamegraph"] }
tikv-jemallocator = { version = "0.6" }
win32job = { version = "2.0.3" }

# SWC (JS tooling stack used by the JS tool runtime)
swc_common = "26.0.0"
swc_ecma_codegen = "32.0.0"
swc_ecma_ast = "29.0.0"
swc_ecma_parser = "45.0.0"
swc_ecma_transforms_base = "49.0.0"
swc_ecma_transforms_typescript = "55.0.0"
swc_ecma_visit = "29.0.0"

# Build helpers
vergen-gix = { version = "9.1.0", features = ["build", "cargo", "rustc"] }

# Dev / testing
arbitrary = { version = "1", features = ["derive"] }
pretty_assertions = "1"
insta = { version = "1", features = ["filters"] }
criterion = { version = "0.8.2", features = ["html_reports"] }
proptest = "1.10.0"
wat = "1.255.0"
loom = { version = "0.7.2", git = "https://github.com/ongardie-atomix/loom", rev = "2b7c402034cc041b5e325384c67bb43bff93c048" }

# Workspace-only utilities for xtask
cargo_metadata = "0.19"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true

[profile.dev]
opt-level = 0
debug = true

[profile.test]
debug = "line-tables-only"
incremental = false

[profile.perf]
inherits = "release"
opt-level = 3
lto = "thin"
codegen-units = 8
debug = 1
strip = false

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }
missing_errors_doc = "allow"
missing_panics_doc = "allow"
module_name_repetitions = "allow"
assert_is_empty = "allow"
suboptimal_flops = "allow"