[package]
name = "pi-ai"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
description = "Phase-2 aggregator mirroring @earendil-works/pi-ai: unified LLM API, providers, model discovery, tokenization, per-turn policy. After Round 17, the Phase-1 leaves (bpe, delight, dialects, embedded-assets, failover, magic-keywords, model, provider, provider-metadata, stream-rules, token-count) are inlined here."

[lints]
workspace = true

[dependencies]
# Aggregator siblings re-exported through the pi facade.
pi-chord = { workspace = true }
pi-client = { workspace = true }
pi-coding-agent = { workspace = true }
pi-protocol = { workspace = true }
# Workspace deps required by the inlined Phase-1 leaves.
anyhow = { workspace = true }
chrono = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
tiktoken-rs = { workspace = true }

[dev-dependencies]
serde_json = { workspace = true }