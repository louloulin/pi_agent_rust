[package]
name = "pi-semantic-graph-core"
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
description = "Pure semantic workspace graph algorithms for Pi"
license = "MIT"

[dependencies]
chrono = { version = "0.4", features = ["serde"] }
serde = { version = "1", features = ["derive", "rc"] }
serde_json = { version = "1", features = ["raw_value"] }
sha1 = "0.11"
sha2 = "0.11"

tempfile = { version = "3.25.0", optional = true }

[dev-dependencies]
tempfile = "3.25.0"
