[package]
name = "pi-tui"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
description = "Phase-2 placeholder mirroring @earendil-works/pi-tui. Round 18 absorbed all tui modules into pi-coding-agent to break the dependency cycle."

[lints]
workspace = true

[features]
# Round 28.2: tui.rs gates rich_rust's syntax-highlighting renderer behind a
# feature so consumers that don't need code blocks can skip the cost.
default = []
tui = ["dep:glamour", "dep:lipgloss"]
syntax-highlighting = []

[dependencies]
# Round 18: pi-tui is now an empty placeholder. All tui files moved to
# pi-coding-agent to break the pi-coding-agent ↔ pi-tui cycle.
#
# Round 28: re-housing leaves here, one at a time, to restore the upstream
# surface. Each leaf gets its own dep list appended below.
#
# terminal_images.rs (Round 28.1)
anyhow = { workspace = true }
base64 = { workspace = true }
# terminal_images.rs (Round 28.1) uses pi_ai::model for MIME sanitization
pi-ai = { workspace = true }
# tui.rs (Round 28.2): the file's only pi-coding-agent dependency was
# `crate::config::Config::global_dir()` (used to derive the TUI log
# directory). That was rewritten into a `tui_log_init_dir(PathBuf)` hook
# called from pi-coding-agent at startup, so pi-tui does not need a
# back-edge to pi-coding-agent (which would re-create the cycle). tui.rs
# falls back to `dirs::home_dir()` when no explicit init was performed.
dirs = { workspace = true }
# tui.rs uses rich_rust for the markup-based renderer.
rich_rust = { version = "0.2", features = ["markdown"] }
# autocomplete.rs (Round 28.3): walks the project tree for @-file suggestions.
ignore = { workspace = true }
# file_refs.rs (Round 28.4): parses file:// URLs into paths for @-file completion.
url = { workspace = true }
# text_utils.rs (Round 28.5): display-width truncation helpers used by the
# message-rendering stack.
unicode-width = { workspace = true }
# overlay_system.rs (Round 30.2): unified overlay stack + set-piece
# surfaces (Esc-stack, toast notifications, welcome / help / picker modals).
serde = { workspace = true }
serde_json = { workspace = true }
# gallery.rs (Round 30.3): visual component gallery harness uses
# serde_json in the Debug impl fallback (`render_report_json`).
# theme.rs (Round 43): theme schema, discovery, validation, and rendering.
tracing = { workspace = true }
pi-error = { workspace = true }
tempfile = { workspace = true }
proptest = { workspace = true }
glamour = { workspace = true, optional = true }
lipgloss = { workspace = true, optional = true }
