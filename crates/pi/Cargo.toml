[package]
name = "pi"
version = "0.4.0"
edition = "2024"
rust-version = "1.95"
description = "Native AI coding agent CLI - Rust port of Pi Agent (modularized Phase-1)"
authors = ["Jeffrey Emanuel", "Multica Modularization"]
license-file = "LICENSE"
repository = "https://github.com/louloulin/pi_agent_rust"
homepage = "https://github.com/louloulin/pi_agent_rust"
documentation = "https://docs.rs/pi"
readme = "README.md"
keywords = ["ai", "cli", "coding-agent", "llm", "anthropic"]
categories = ["command-line-utilities", "development-tools"]
autobins = false
# Workspace member of pi.rs Phase-1. Source tree relocated from repo root into
# crates/pi/ while preserving every module, example, bench, and test.
include = [
    "/docs/extension-artifact-provenance.json",
    "/docs/evidence/tool-output-context-cache.jsonl",
    "/docs/wit/extension.wit",
    "/docs/provider-upstream-model-ids-snapshot.json",
    "/docs/schema/extension_protocol.json",
    "/legacy_pi_mono_code/pi-mono/packages/ai/src/models.generated.ts",
    "/tests/fixtures/agent_mail/schema_corrupt_health.json",
    "/Cargo.toml",
    "/LICENSE",
    "/README.md",
    "/CHANGELOG.md",
    "/build.rs",
    "/src/**",
]

[lib]
name = "pi"
path = "src/lib.rs"

[[bin]]
name = "pi"
path = "src/main.rs"
required-features = ["tui"]

[[bin]]
name = "pi_legacy_capture"
path = "src/bin/pi_legacy_capture.rs"
required-features = ["internal-legacy-capture"]

[[bin]]
name = "pi_mcp_fixture"
path = "src/bin/pi_mcp_fixture.rs"
required-features = ["internal-mcp-fixture"]

# (Examples and benches auto-discovered from examples/ and benches/ — Cargo
# discovers them by default; no [[example]] entries required.)

[[bench]]
name = "tools"
harness = false

[[bench]]
name = "extensions"
harness = false

[[bench]]
name = "extension_budget_inputs"
harness = false

[[bench]]
name = "semantic_context"
harness = false

[[bench]]
name = "pijs_workload"
path = "examples/pijs_workload.rs"
harness = false

[[bench]]
name = "system"
harness = false

[[bench]]
name = "tui_perf"
harness = false

[[bench]]
name = "search_backends"
harness = false

