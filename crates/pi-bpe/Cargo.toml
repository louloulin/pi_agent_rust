[package]
name = "pi-bpe"
description = "Vendored tiktoken BPE rank-table loader for pi — Stage 2 leaf crate"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true

[lints.rust]
# Vendored tiktoken (tiktoken-rs 0.12.0, MIT) uses one transmute to read
# `std::thread::ThreadId` into a comparable integer; the legacy `bpe.rs`
# module allowed it at the module level. The leaf keeps that allowance
# because the source is verbatim from upstream. Clippy lints still come
# from the workspace table.
unsafe_code = "allow"

[dependencies]
fancy-regex = { workspace = true }
rustc-hash = { workspace = true }
bstr = { workspace = true }
