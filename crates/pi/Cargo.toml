clap = { workspace = true }
clap_complete = { workspace = true }
pi-buffer-shim = { workspace = true }
pi-cli = { workspace = true, features = ["ftui"] }
pi-crypto-shim = { workspace = true }
pi-delight = { workspace = true }
pi-dialects = { workspace = true }
pi-flake-classifier = { workspace = true }
pi-jsonrpc = { workspace = true }
pi-markdown-rich = { workspace = true }
pi-magic-keywords = { workspace = true }
pi-pmu-telemetry = { workspace = true }
pi-sse = { workspace = true }
pi-stats = { workspace = true }
pi-token-count = { workspace = true }
asupersync = { workspace = true }
futures = { workspace = true }
async-trait = { workspace = true }
htmd = { workspace = true }
pdf-extract = { workspace = true, optional = true }
url = { workspace = true }
ctrlc = { workspace = true }
portable-pty = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
json5 = { workspace = true }
anyhow = { workspace = true }
thiserror = { workspace = true }
rich_rust = { workspace = true }
crossterm = { workspace = true, optional = true }
enable-ansi-support = { workspace = true }
bubbletea = { workspace = true, optional = true }
lipgloss = { workspace = true, optional = true }
bubbles = { workspace = true, optional = true }
glamour = { workspace = true, optional = true }
unicode-width = { workspace = true, optional = true }
textwrap = { workspace = true, optional = true }
arboard = { workspace = true, optional = true }
ftui = { workspace = true, optional = true }
ftui-extras = { workspace = true, optional = true }
dirs = { workspace = true }
tempfile = { workspace = true }
fs4 = { workspace = true }
glob = { workspace = true }
ignore = { workspace = true }
globset = { workspace = true }
grep-regex = { workspace = true }
grep-searcher = { workspace = true }
jsonschema = { workspace = true }
rustix = { workspace = true }
crossbeam-queue = { workspace = true }
fsqlite = { workspace = true }
chrono = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
uuid = { workspace = true }
memchr = { workspace = true }
signal-hook = { workspace = true }
base64 = { workspace = true }
flate2 = { workspace = true }
toml = { workspace = true }
sha2 = { workspace = true }
sha1 = { workspace = true }
md-5 = { workspace = true }
hmac = { workspace = true }
pbkdf2 = { workspace = true }
scrypt = { workspace = true }
getrandom = { workspace = true }
regex = { workspace = true }
ring = { workspace = true }
semver = { workspace = true }
crc32c = { workspace = true }
ast-grep-core = { workspace = true }
ast-grep-language = { workspace = true }
unicode-normalization = { workspace = true }
xxhash-rust = { workspace = true }
similar = { workspace = true }
sysinfo = { workspace = true }
rquickjs = { workspace = true }
pprof = { workspace = true, optional = true }
swc_common = { workspace = true }
swc_ecma_codegen = { workspace = true }
swc_ecma_ast = { workspace = true }
swc_ecma_parser = { workspace = true }
swc_ecma_transforms_base = { workspace = true }
swc_ecma_transforms_typescript = { workspace = true }
swc_ecma_visit = { workspace = true }
wasmtime = { workspace = true, optional = true }
filetime = { workspace = true }
image = { workspace = true, optional = true }
tikv-jemallocator = { workspace = true, optional = true }
win32job = { workspace = true, optional = true }

[build-dependencies]
crc32c = { workspace = true }
flate2 = { workspace = true }
vergen-gix = { workspace = true }

[dev-dependencies]
arbitrary = { workspace = true }
pretty_assertions = { workspace = true }
insta = { workspace = true }
tempfile = { workspace = true }
asupersync = { workspace = true }
criterion = { workspace = true }
jsonschema = { workspace = true }
proptest = { workspace = true }
wat = { workspace = true }
toml = { workspace = true }
loom = { workspace = true }

[target.'cfg(any(target_os = "linux", target_os = "macos"))'.dependencies]
tikv-jemallocator = { workspace = true, optional = true }

[target.'cfg(target_os = "freebsd")'.dependencies]
rquickjs = { workspace = true }

[target.'cfg(target_os = "android")'.dependencies]
rquickjs = { workspace = true }

[target.'cfg(windows)'.dependencies]
win32job = { workspace = true }

[features]
default = ["sqlite-sessions", "tui", "bpe-tokens", "ftui"]
full = [
    "image-resize",
    "jemalloc",
    "clipboard",
    "wasm-host",
    "sqlite-sessions",
    "syntax-highlighting",
    "tui",
    "url-pdf",
    "bpe-tokens",
    "rich_rust/full",
]
bpe-tokens = ["pi-token-count/bpe-tokens"]
url-pdf = ["dep:pdf-extract"]
profiler = ["dep:pprof"]
tui = [
    "dep:crossterm",
    "dep:bubbletea",
    "dep:lipgloss",
    "dep:bubbles",
    "dep:glamour",
    "dep:unicode-width",
    "dep:textwrap",
]
ftui = ["dep:ftui", "dep:ftui-extras", "tui"]
image-resize = ["image"]
clipboard = ["dep:arboard"]
wasm-host = ["dep:wasmtime"]
sqlite-sessions = []
syntax-highlighting = ["rich_rust/syntax"]
ext-conformance = []
fuzzing = []
internal-legacy-capture = []
internal-persistence-fault-injection = []
internal-mcp-fixture = []
loom-tests = []
manual-timing-tests = []
jemalloc = ["dep:tikv-jemallocator"]

[[test]]
name = "hostcall_queue_loom"
path = "tests/hostcall_queue_loom.rs"
required-features = ["loom-tests"]

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true

[profile.dev]
opt-level = 0
debug = true

[profile.test]
debug = "line-tables-only"
incremental = false

[profile.perf]
inherits = "release"
opt-level = 3
lto = "thin"
codegen-units = 8
debug = 1
strip = false

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }
missing_errors_doc = "allow"
missing_panics_doc = "allow"
module_name_repetitions = "allow"
assert_is_empty = "allow"
suboptimal_flops = "allow"