[workspace]
resolver = "2"
# Phase-2 modularization of pi.rs. The legacy single-crate tree was
# relocated to crates/pi/ unchanged; crates/pi-mono is the workspace
# aggregator; the 11 phase-2 top-level package crates (pi-ai,
# pi-agent-core, pi-coding-agent, pi-tui, pi-telemetry, pi-protocol,
# pi-chord, pi-client, pi-server, pi-session-backends, pi-evals)
# mirror the @earendil-works/pi packages structure. xtask hosts
# workspace plumbing (cargo xtask ci).
members = [
    "crates/pi",
    "crates/pi-ai",
    "crates/pi-agent-core",
    "crates/pi-mono",
    "crates/pi-diff-core",
    "crates/pi-env-core",
    "crates/pi-chord",
    "crates/pi-coding-agent",
    "crates/pi-error",
    "crates/pi-evals",
    "crates/pi-server",
    "crates/pi-session-backends",
    "crates/pi-protocol",
    "crates/pi-telemetry",
    "crates/pi-tui",
    "xtask",
]
# Exclude the workspace_smoke integration test's own target directory.
exclude = []

[workspace.package]
version = "0.4.0"
edition = "2024"
rust-version = "1.95"
authors = ["Jeffrey Emanuel", "Multica Modularization"]
license = "MIT"
repository = "https://github.com/louloulin/pi_agent_rust"
homepage = "https://github.com/louloulin/pi_agent_rust"
documentation = "https://docs.rs/pi"
readme = "README.md"

# Single source of truth for crate dependency versions. Member crates
# reference these via dep = { workspace = true }. New top-level deps must
# land here first, then be claimed by a member.
[workspace.dependencies]
# CLI
clap = { version = "4.5.60", features = ["derive", "env", "string"] }
clap_complete = "4.5.66"

# Phase-2 top-level packages (single source of truth) — Round 17 inlined all leaves.
# Phase-2 top-level package crates (aggregators mirroring
# @earendil-works/pi packages).
pi-ai = { path = "crates/pi-ai", version = "0.1.0" }
pi-agent-core = { path = "crates/pi-agent-core", version = "0.1.0" }
pi-coding-agent = { path = "crates/pi-coding-agent", version = "0.1.0" }
pi-error = { path = "crates/pi-error", version = "0.1.0" }
pi-tui = { path = "crates/pi-tui", version = "0.1.0" }
pi-telemetry = { path = "crates/pi-telemetry", version = "0.1.0" }
pi-protocol = { path = "crates/pi-protocol", version = "0.1.0" }
pi-chord = { path = "crates/pi-chord", version = "0.1.0" }
pi-diff-core = { path = "crates/pi-diff-core", version = "0.1.0" }
pi-env-core = { path = "crates/pi-env-core", version = "0.1.0" }
pi-client = { path = "crates/pi-client", version = "0.1.0" }
pi-server = { path = "crates/pi-server", version = "0.1.0" }
pi-session-backends = { path = "crates/pi-session-backends", version = "0.1.0" }
pi-evals = { path = "crates/pi-evals", version = "0.1.0" }
# Phase-1 leaf crates removed (Round 17): inlined into the 11 Phase-2 packages.

# Async runtime
asupersync = { version = "0.4.4", default-features = false, features = ["tls-webpki-roots", "tls-native-roots", "test-internals"] }
futures = "0.3"
async-trait = "0.1"

# URL reading
htmd = "0.5.5"
pdf-extract = { version = "0.12" }
url = "2"

# Signals / PTY
ctrlc = "3.5.2"
portable-pty = "0.9"

# Serialization
serde = { version = "1", features = ["derive", "rc"] }
serde_json = { version = "1", features = ["raw_value"] }
json5 = "1.3.1"
toml = "1.0.3"

# Errors
anyhow = "1.0.104"
thiserror = "2"

# Terminal output / TUI
rich_rust = { version = "0.2.2", features = ["markdown"] }
crossterm = { version = "0.29" }
enable-ansi-support = "0.2"
bubbletea = { package = "charmed-bubbletea", version = "0.2.0" }
lipgloss = { package = "charmed-lipgloss", version = "0.2.0" }
bubbles = { package = "charmed-bubbles", version = "0.2.0" }
glamour = { package = "charmed-glamour", version = "0.2.0" }
unicode-width = { version = "0.2" }
textwrap = { version = "0.16" }
arboard = { version = "3.6.1" }
ftui = { version = "0.7", default-features = false, features = ["runtime", "crossterm"] }
ftui-extras = { version = "0.7", default-features = false, features = ["markdown"] }

# Filesystem
dirs = "6"
tempfile = "3.25.0"
fs4 = "1.1"
glob = "0.3"
ignore = "0.4"
globset = "0.4"
grep-regex = "0.1"
grep-searcher = "0.1"
rustix = { version = "1.1.4", features = ["fs", "process"] }
crossbeam-queue = "0.3"
jsonschema = { version = "0.42.0", default-features = false }
fsqlite = { version = "0.3.14", default-features = false, features = ["native", "fts5"] }

# Time
chrono = { version = "0.4", features = ["serde"] }

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Utilities
uuid = { version = "1.21.0", features = ["v4"] }
memchr = "2.8.0"
signal-hook = "0.4.4"
base64 = "0.23"
flate2 = "1.1.9"
sha2 = "0.11"
sha1 = "0.11"
md-5 = "0.11"
hmac = "0.13"
pbkdf2 = { version = "0.13.0", features = ["hmac"] }
scrypt = { version = "0.12.0", default-features = false }
getrandom = "0.4.1"
regex = "1.12.3"
ring = "0.17.14"
semver = "1.0.27"
crc32c = "0.6"
ast-grep-core = "0.40"
fancy-regex = "0.18.0"
rustc-hash = "2.1.3"
bstr = "1.13.1"
ast-grep-language = { version = "0.40", default-features = false, features = [
    "tree-sitter-bash",
    "tree-sitter-python",
    "tree-sitter-javascript",
    "tree-sitter-typescript",
    "tree-sitter-ruby",
    "tree-sitter-rust",
    "tree-sitter-go",
] }
unicode-normalization = "0.1"
xxhash-rust = { version = "0.8", features = ["xxh32"] }
similar = "2"
sysinfo = "0.39.6"
filetime = "0.2.27"

# Plugin runtimes
rquickjs = { version = "0.12.2", features = ["futures", "loader"] }
wasmtime = { version = "47.0.3", features = ["component-model"] }

# Image / PDF / sampling / alloc
image = { version = "0.25", default-features = false, features = [
    "jpeg",
    "png",
    "gif",
    "webp",
    "rayon",
] }
tiktoken-rs = { version = "0.12.0" }
pprof = { version = "0.14", features = ["flamegraph"] }
tikv-jemallocator = { version = "0.6" }
win32job = { version = "2.0.3" }

# SWC (JS tooling stack used by the JS tool runtime)
swc_common = "26.0.0"
swc_ecma_codegen = "32.0.0"
swc_ecma_ast = "29.0.0"
swc_ecma_parser = "45.0.0"
swc_ecma_transforms_base = "49.0.0"
swc_ecma_transforms_typescript = "55.0.0"
swc_ecma_visit = "29.0.0"

# Build helpers
vergen-gix = { version = "9.1.0", features = ["build", "cargo", "rustc"] }

# Dev / testing
arbitrary = { version = "1", features = ["derive"] }
pretty_assertions = "1"
insta = { version = "1", features = ["filters"] }
criterion = { version = "0.8.2", features = ["html_reports"] }
proptest = "1.10.0"
wat = "1.255.0"
loom = { version = "0.7.2", git = "https://github.com/ongardie-atomix/loom", rev = "2b7c402034cc041b5e325384c67bb43bff93c048" }

# Workspace-only utilities for xtask
cargo_metadata = "0.19"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true

[profile.dev]
opt-level = 0
debug = true

[profile.test]
debug = "line-tables-only"
incremental = false

[profile.perf]
inherits = "release"
opt-level = 3
lto = "thin"
codegen-units = 8
debug = 1
strip = false

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }
missing_errors_doc = "allow"
missing_panics_doc = "allow"
module_name_repetitions = "allow"
assert_is_empty = "allow"
suboptimal_flops = "allow"