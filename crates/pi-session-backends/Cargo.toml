[package]
name = "pi-session-backends"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
description = "Phase-2 module mirroring @earendil-works/pi-session-backends: session persistence backends (SQLite, JSONL) — currently still in crates/pi-coding-agent/src"

[lints]
workspace = true

[dependencies]
